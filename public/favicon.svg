<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="arrowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="arrowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.8"/>
    </linearGradient>
  </defs>
  
  <!-- Background Card -->
  <rect width="32" height="32" rx="8" fill="#0b0f19"/>
  <rect width="32" height="32" rx="8" fill="url(#bgGlow)"/>
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="7.25" fill="none" stroke="url(#borderGrad)" stroke-width="1.2"/>
  
  <!-- Convert / Loop Arrows -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top-Right Arrow -->
    <path d="M 9.5 15.5 A 6.5 6.5 0 0 1 22 13" stroke="url(#arrowGrad1)" stroke-width="2.6"/>
    <path d="M 18 9.5 L 22.5 13 L 18 16.5" stroke="url(#arrowGrad1)" stroke-width="2.6"/>
    
    <!-- Bottom-Left Arrow -->
    <path d="M 22.5 16.5 A 6.5 6.5 0 0 1 10 19" stroke="url(#arrowGrad2)" stroke-width="2.6"/>
    <path d="M 14 22.5 L 9.5 19 L 14 15.5" stroke="url(#arrowGrad2)" stroke-width="2.6"/>
  </g>
  
  <!-- Center Core Dot -->
  <circle cx="16" cy="16" r="1.5" fill="#f8fafc"/>
</svg>
